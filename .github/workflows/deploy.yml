name: Deploy to Cloud Run

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "デプロイするイメージタグ (デフォルト: コミット SHA)"
        required: false

# 同時に複数の deploy が走らないようにする
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-northeast1
  AR_REPO: ${{ secrets.GCP_PROJECT_ID }}/action  # Artifact Registry: REGION-docker.pkg.dev/PROJECT/action

jobs:
  build-and-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation に必要

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ── frontend ──────────────────────────────────────────
      - name: Build frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_USE_MOCKS=false \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_GCLOUD_PROJECT="${{ env.PROJECT_ID }}" \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/frontend:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/frontend:latest \
            ActionAct/frontend

      - name: Push frontend
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/frontend:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/frontend:latest

      # ── act-api ───────────────────────────────────────────
      - name: Build act-api
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-api:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-api:latest \
            ActionAct/act-api

      - name: Push act-api
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-api:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-api:latest

      # ── act-adk-worker ────────────────────────────────────
      - name: Build act-adk-worker
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-adk-worker:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-adk-worker:latest \
            ActionAct/act-adk-worker

      - name: Push act-adk-worker
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-adk-worker:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/act-adk-worker:latest

      # ── organize ─────────────────────────────────────────
      - name: Build organize
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/organize:${{ steps.tag.outputs.tag }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/organize:latest \
            ActionOrganize

      - name: Push organize
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/organize:${{ steps.tag.outputs.tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.AR_REPO }}/organize:latest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7"

      - name: Terraform apply
        working-directory: terraform
        env:
          GODEBUG: http2client=0
        run: |
          terraform init
          terraform apply -auto-approve \
            -var-file="tfvars/prod.tfvars" \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -var="firebase_api_key=${{ secrets.FIREBASE_API_KEY }}" \
            -var="firebase_auth_domain=${{ secrets.FIREBASE_AUTH_DOMAIN }}" \
            -var="firebase_app_id=${{ secrets.FIREBASE_APP_ID }}"

      - name: Deploy Firestore rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore:rules --project ${{ env.PROJECT_ID }} --non-interactive

      - name: Show deployed services
        run: |
          echo "=== Deployment complete ==="
          gcloud run services list --region "${{ env.REGION }}" --format="table(name,status.url)"
