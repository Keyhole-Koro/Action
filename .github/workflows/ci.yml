name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── act-api (Go) ───
  test-act-api:
    name: act-api (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ActionAct/act-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ActionAct/act-api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -race ./internal/...

  # ─── act-adk-worker (Python) ───
  test-adk-worker:
    name: act-adk-worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ActionAct/act-adk-worker
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ActionAct/act-adk-worker/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Test
        run: python -m pytest tests/ -v --override-ini="asyncio_mode=auto"

  # ─── ActionOrganize (TypeScript) ───
  test-organize:
    name: ActionOrganize (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ActionOrganize
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ActionOrganize/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

  deploy-frontend:
    name: Deploy frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: [test-act-api, test-adk-worker, test-organize]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write  # 変更: OIDCトークン発行のために必須
    env:
      PROJECT_ID: action-490203
      REGION: asia-northeast1
      REPOSITORY: action
      IMAGE_NAME: frontend
      USE_MOCKS: "true"
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # 変更: JSONキーからWIF認証へ差し替え
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push frontend image
        run: |
          IMAGE_URI=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}
          docker build \
            --build-arg NEXT_PUBLIC_USE_MOCKS=${USE_MOCKS} \
            -t ${IMAGE_URI}:${GITHUB_SHA} \
            -t ${IMAGE_URI}:latest \
            ActionAct/frontend
          docker push ${IMAGE_URI}:${GITHUB_SHA}
          docker push ${IMAGE_URI}:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ActionAct/terraform
        run: terraform init -reconfigure

      - name: Terraform apply
        working-directory: ActionAct/terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${PROJECT_ID}" \
            -var="image_tag=${GITHUB_SHA}" \
            -var="use_mocks=${USE_MOCKS}"

      - name: Show frontend URL
        working-directory: ActionAct/terraform
        run: terraform output -raw frontend_url