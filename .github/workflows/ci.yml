name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── act-api (Go) ───
  test-act-api:
    name: act-api (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ActionAct/act-api
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ActionAct/act-api/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -race ./internal/...

  # ─── act-adk-worker (Python) ───
  test-adk-worker:
    name: act-adk-worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ActionAct/act-adk-worker
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ActionAct/act-adk-worker/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Test
        run: python -m pytest tests/ -v --override-ini="asyncio_mode=auto"

  # ─── ActionOrganize (TypeScript) ───
  test-organize:
    name: ActionOrganize (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ActionOrganize
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ActionOrganize/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run
