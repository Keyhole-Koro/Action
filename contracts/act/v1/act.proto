syntax = "proto3";

package act.v1;

option go_package = "act-api/gen/act/v1;actv1";

// RunActRequest は RunAct の入力契約。
// topic_id, workspace_id, request_id, act_type, user_message は必須。
message RunActRequest {
  // 知識正本キー（必須）
  string topic_id = 1;
  // workspace 境界（必須）
  string workspace_id = 2;
  // 冪等用UUID（必須）
  string request_id = 3;
  // 実行タイプ（必須）
  ActType act_type = 4;
  // ユーザー入力（必須）
  string user_message = 5;
  // 起点ノード
  string anchor_node_id = 6;
  // 明示コンテキストノード群
  repeated string context_node_ids = 7;
  // モデル設定（省略可）
  LLMConfig llm_config = 8;
  // 旧クライアント互換用。認証正本には使わない（deprecated）
  string uid = 9;
  // フィールド番号 10 は廃止済み (旧: user_media インラインバイト)。
  reserved 10;
  reserved "user_media";
  // frontend が送る選択ノードの内容スナップショット
  repeated SelectedNodeContext selected_node_contexts = 11;
  // GCS に事前アップロード済みファイルの参照。
  repeated MediaRef user_media_refs = 12;
}

message SelectedNodeContext {
  string node_id = 1;
  string label = 2;
  string kind = 3;
  string context_summary = 4;
  string content_md = 5;
  string thought_md = 6;
  string detail_html = 7;
}

// MediaRef references a file already uploaded to GCS via /api/upload/presign.
message MediaRef {
  string mime_type = 1;
  // Object path within the bucket (e.g. "mind/inputs/in_abc123.raw").
  string gcs_object_key = 2;
  int64 size_bytes = 3;
}

enum ActType {
  ACT_TYPE_UNSPECIFIED = 0;
  ACT_TYPE_EXPLORE = 1;
  ACT_TYPE_CONSULT = 2;
  ACT_TYPE_INVESTIGATE = 3;
}

message LLMConfig {
  string model = 1;
  bool enable_grounding = 2;
  bool enable_thinking = 3;
}

// RunActEvent はサーバーストリームのレスポンス。
// text_delta or patch_ops or terminal or action_trigger のいずれかを持つ。
message RunActEvent {
  oneof event {
    TextDelta text_delta = 1;
    PatchOps patch_ops = 2;
    Terminal terminal = 3;
    ActionTrigger action_trigger = 5;
  }
  // true のとき thought（思考ストリーム）。false のとき通常回答。
  bool is_thought = 4;
}

message TextDelta {
  string text = 1;
}

message PatchOps {
  repeated PatchOp ops = 1;
}

message PatchOp {
  string op = 1;        // "upsert" or "append_md"
  string node_id = 2;
  string content = 3;
  // request 内で単調増加する append シーケンス。
  uint64 seq = 4;
  // append 適用前の本文長。frontend 側の安全適用に使う。
  uint32 expected_offset = 5;
  // ノードの種別。upsert 時に使用（例: "act", "suggestion"）。
  string kind = 6;
  // 親ノード ID。子ノード生成時に使用。
  string parent_id = 7;
  // ノードのラベル。upsert 時に使用。
  string label = 8;
}

// LLM がフロントへ送るアクション命令。
message ActionTrigger {
  // アクション種別: "start_act"
  string action = 1;
  // アクション引数（JSON シリアライズ済み）
  string payload_json = 2;
}

message SourceRef {
  string id = 1;
  string kind = 2;
  string label = 3;
  string uri = 4;
}

message Terminal {
  bool done = 1;
  ErrorInfo error = 2;
  repeated string used_context_node_ids = 3;
  repeated SelectedNodeContext used_selected_node_contexts = 4;
  repeated string used_tools = 5;
  repeated SourceRef used_sources = 6;
}

message ErrorInfo {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string stage = 4;
  string trace_id = 5;
  int64 retry_after_ms = 6;
}

service ActService {
  rpc RunAct(RunActRequest) returns (stream RunActEvent) {}
}
