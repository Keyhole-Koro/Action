version: v1
plugins:
  # Go (act-api) 向け protobuf メッセージ
  - plugin: buf.build/protocolbuffers/go
    out: ../ActionAct/act-api/gen
    opt: paths=source_relative
  # Go (act-api) 向け Connect RPC ハンドラ
  - plugin: buf.build/connectrpc/go
    out: ../ActionAct/act-api/gen
    opt: paths=source_relative

  # TypeScript (frontend) 向け protobuf メッセージ
  - plugin: buf.build/bufbuild/es
    out: ../ActionAct/frontend/src/gen
    opt: target=ts
  # TypeScript (frontend) 向け Connect RPC クライアント
  - plugin: buf.build/connectrpc/es
    out: ../ActionAct/frontend/src/gen
    opt: target=ts
